<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boda Rivas Terán - Ubicaciones</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3yn5orG9tK1nqYz8VPaDdAN87Vh7A="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    :root{
      --ceremonia:#9ABEE3;
      --recepcion:#8C79B5;
      --hospedaje:#530F1E;
      --texto:#292929;
      --fondo:#F7F4F2;
      --boton:#530F1E;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--texto);
      background:var(--fondo);
    }

    .page{
      max-width:900px;
      margin:0 auto;
      background:#fff;
      min-height:100vh;
    }

    .hero{
      width:100%;
      aspect-ratio:16 / 7;
      background:
        linear-gradient(rgba(75,35,46,.08),rgba(75,35,46,.08)),
        url('encabezado.jpg') center/cover no-repeat;
    }

    .content{
      padding:18px 14px 24px;
    }

    h1{
      margin:0 0 12px;
      text-align:center;
      color:#530F1E;
      font-size:24px;
      font-weight:700;
    }

    .legend{
      display:flex;
      justify-content:center;
      gap:16px;
      flex-wrap:wrap;
      margin:0 0 14px;
      font-size:14px;
    }

    .legend-item{
      display:flex;
      align-items:center;
      gap:6px;
    }

    .dot{
      width:12px;
      height:12px;
      border-radius:50%;
      display:inline-block;
    }

    .dot.ceremonia{background:var(--ceremonia);}
    .dot.recepcion{background:var(--recepcion);}
    .dot.hospedaje{background:var(--hospedaje);}

    #map{
      width:100%;
      height:62vh;
      min-height:460px;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 4px 18px rgba(0,0,0,.08);
      background:#ece8e5;
    }

    .place-label{
      background:rgba(255,255,255,.95);
      border:none;
      box-shadow:0 1px 4px rgba(0,0,0,.18);
      color:#222;
      font-weight:700;
      padding:4px 7px;
      border-radius:6px;
      font-size:12px;
      white-space:nowrap;
    }

    .popup-title{
      font-weight:700;
      margin-bottom:8px;
      color:#530F1E;
      font-size:15px;
    }

    .website-btn{
      display:inline-block;
      margin-top:4px;
      padding:8px 10px;
      border-radius:8px;
      background:var(--boton);
      color:#fff !important;
      text-decoration:none;
      font-weight:700;
      font-size:13px;
    }

    @media (max-width:600px){
      #map{
        height:64vh;
        min-height:500px;
      }
      .content{padding:14px 10px 20px}
      h1{font-size:21px}
      .legend{
        gap:12px;
        font-size:13px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!--
      ENCABEZADO:
      Reemplaza "encabezado.jpg" por el nombre de tu imagen final.
      Debe estar en la misma carpeta que este archivo HTML.
    -->
    <div class="hero" aria-label="Encabezado Boda Rivas Terán"></div>

    <section class="content">
      <h1>Ubicaciones</h1>

      <div class="legend">
        <div class="legend-item"><span class="dot ceremonia"></span> Ceremonia</div>
        <div class="legend-item"><span class="dot recepcion"></span> Recepción</div>
        <div class="legend-item"><span class="dot hospedaje"></span> Hospedajes</div>
      </div>

      <div id="map"></div>
    </section>
  </main>

  <script>
    /*
      ============================================================
      AQUÍ CAMBIAS TODAS LAS UBICACIONES
      ============================================================

      Para cada punto puedes modificar:
      - nombre
      - lat  = latitud
      - lng  = longitud
      - tipo = "ceremonia", "recepcion" o "hospedaje"
      - sitioWeb = URL oficial del lugar

      Si sitioWeb queda vacío, no aparecerá el botón.
    */

    const lugares = [

      // ===== 1. CEREMONIA =====
      {
        nombre: "Ceremonia",
        lat: 0.234000,        // <-- CAMBIAR LATITUD
        lng: -78.265000,      // <-- CAMBIAR LONGITUD
        tipo: "ceremonia",
        sitioWeb: ""          // <-- PEGAR AQUÍ EL SITIO WEB
      },

      // ===== 2. RECEPCIÓN =====
      {
        nombre: "Recepción",
        lat: 0.228000,        // <-- CAMBIAR LATITUD
        lng: -78.260000,      // <-- CAMBIAR LONGITUD
        tipo: "recepcion",
        sitioWeb: ""          // <-- PEGAR AQUÍ EL SITIO WEB
      },

      // ===== 3. HOSPEDAJES =====
      {
        nombre: "Hostería Cabañas del Lago",
        lat: 0.215000,
        lng: -78.205000,
        tipo: "hospedaje",
        sitioWeb: ""
      },
      {
        nombre: "Hacienda Cusín",
        lat: 0.195000,
        lng: -78.190000,
        tipo: "hospedaje",
        sitioWeb: ""
      },
      {
        nombre: "Hostería PuertoLago",
        lat: 0.210000,
        lng: -78.220000,
        tipo: "hospedaje",
        sitioWeb: ""
      },
      {
        nombre: "Hotel Otavalo",
        lat: 0.235000,
        lng: -78.262000,
        tipo: "hospedaje",
        sitioWeb: ""
      },
      {
        nombre: "Hacienda Pinsaquí",
        lat: 0.270000,
        lng: -78.285000,
        tipo: "hospedaje",
        sitioWeb: ""
      },
      {
        nombre: "Hotel El Indio Inn",
        lat: 0.233000,
        lng: -78.263000,
        tipo: "hospedaje",
        sitioWeb: ""
      }
    ];

    /* DESDE AQUÍ NO NECESITAS TOCAR NADA */

    const map = L.map('map', {
      zoomControl: true,
      attributionControl: true,
      scrollWheelZoom: true
    });

    /*
      FONDO DEL MAPA:
      Se usa OpenFreeMap para evitar el bloqueo 403 de los tiles
      públicos de OpenStreetMap.
    */
    L.tileLayer(
      'https://tiles.openfreemap.org/styles/liberty/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution:
          '&copy; OpenStreetMap contributors &copy; OpenFreeMap'
      }
    ).addTo(map);

    const colores = {
      ceremonia: '#9ABEE3',
      recepcion: '#8C79B5',
      hospedaje: '#530F1E'
    };

    const bounds = [];

    lugares.forEach(lugar => {
      const marker = L.circleMarker([lugar.lat, lugar.lng], {
        radius: 9,
        color: '#ffffff',
        weight: 2,
        fillColor: colores[lugar.tipo],
        fillOpacity: 1
      }).addTo(map);

      marker.bindTooltip(lugar.nombre, {
        permanent: true,
        direction: 'top',
        offset: [0, -10],
        className: 'place-label'
      });

      const botonSitioWeb = lugar.sitioWeb
        ? `<br><a class="website-btn" href="${lugar.sitioWeb}" target="_blank" rel="noopener noreferrer">Sitio web</a>`
        : '';

      marker.bindPopup(`
        <div class="popup-title">${lugar.nombre}</div>
        ${botonSitioWeb}
      `);

      bounds.push([lugar.lat, lugar.lng]);
    });

    if (bounds.length > 0) {
      map.fitBounds(bounds, {
        padding: [35, 35],
        maxZoom: 13
      });
    } else {
      map.setView([0.23, -78.26], 11);
    }
  </script>
</body>
</html>
